<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>

    <!-- Accent Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #A3E635;
      letter-spacing: 0.5px;
    }
    .badge {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #0F2027;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1;
    }
    .pulse-circle {
      animation: pulse 4s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { r: 120px; opacity: 0.2; }
      100% { r: 180px; opacity: 0.4; }
    }
    .wave-line {
      stroke: url(#leafGrad);
      stroke-width: 2;
      fill: none;
      opacity: 0.4;
      stroke-dasharray: 8 4;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
  
  <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
  <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
  <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
  <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

  <!-- Dynamic Glowing Aspect (Background Layer) -->
  <circle cx="1000" cy="180" r="150" fill="url(#glow)" class="pulse-circle"/>

  <!-- Satellite Orbit / Wave Line (Background Layer) -->
  <path d="M-50,280 Q300,100 600,220 T1250,120" class="wave-line" />

  <!-- Decorative Orbit Dots -->
  <circle cx="950" cy="140" r="6" fill="#38ef7d">
    <animate attributeName="cy" values="140;150;140" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="210" r="4" fill="#11998e">
    <animate attributeName="cx" values="1050;1060;1050" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Content Group (Foreground Layer) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="55" width="260" height="32" rx="16" fill="url(#leafGrad)"/>
    <text x="130" y="76" text-anchor="middle" class="badge">🌱 AGTECH &amp; CLIMATE TECH</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Agricultural Carbon</text>
    <text x="0" y="195" class="title" fill="#38ef7d">Management Ecosystem 🌾</text>

    <!-- Subtitle -->
    <text x="0" y="245" class="subtitle">Curated Soil MRV, Farm GHG Calculators, Carbon Markets &amp; Satellite Remote Sensing</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="65" y="18" font-family="Segoe UI" font-size="12" fill="#E2E8F0" text-anchor="middle">🛰️ Satellite MRV</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="140" height="28" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="210" y="18" font-family="Segoe UI" font-size="12" fill="#E2E8F0" text-anchor="middle">🚜 Farm Accounting</text>

      <!-- Tag 3 -->
      <rect x="290" y="0" width="150" height="28" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="365" y="18" font-family="Segoe UI" font-size="12" fill="#E2E8F0" text-anchor="middle">💰 Carbon Markets</text>

      <!-- Tag 4 -->
      <rect x="450" y="0" width="140" height="28" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
      <text x="520" y="18" font-family="Segoe UI" font-size="12" fill="#E2E8F0" text-anchor="middle">🔓 Open-Source</text>
    </g>
  </g>
</svg>
